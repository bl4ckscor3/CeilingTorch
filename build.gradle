plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.33'
group = 'bl4ckscor3.mod.ceilingtorch'

base {
	archivesName = 'ceilingtorch-26.1.2'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
    version = "26.1.2.82"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("run/" + name)
			ideName = "CeilingTorch " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}
	}

	mods {
		ceilingtorch {
			sourceSet(sourceSets.main)
		}
	}
}

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
	implementation 'curse.maven:jei-238222:8419117'

	implementation "curse.maven:additional-lights-384991:7923974"
	implementation "curse.maven:bagus-lib-866533:7959019" //tofucraftreload dependency
	implementation "curse.maven:sbm-bone-torch-238695:7878430"
	implementation "curse.maven:tofucraftreload-317469:8460775"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "Ceiling Torch",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "Ceiling Torch",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 25
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}