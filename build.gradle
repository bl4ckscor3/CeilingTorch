plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.34'
group = 'bl4ckscor3.mod.ceilingtorch'

base {
	archivesName = 'ceilingtorch-26.1.2'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
    version = "26.1.2.82"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("run/" + name)
			ideName = "CeilingTorch " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}
	}

	mods {
		ceilingtorch {
			sourceSet(sourceSets.main)
		}
	}
}

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
	implementation 'curse.maven:jei-238222:8419117'

	compileOnly "curse.maven:additional-lights-384991:7923974"
	implementation "curse.maven:bagus-lib-866533:7959019" //tofucraftreload dependency
	implementation "curse.maven:colored-torches-1161227:7875650"
	implementation "curse.maven:common-capabilities-247007:8469491" //integrated dynamics dependency
	implementation "curse.maven:context-matters-1265417:8200830" //xycraft world dependency
	implementation "curse.maven:curios-309927:8463519" //occultism dependency
	implementation "curse.maven:cyclops-core-232758:8469538" //integrated dynamics dependency
	implementation "curse.maven:geckolib-388172:8327201" //occultism dependency
	implementation "curse.maven:integrated-dynamics-236307:8469202"
	implementation "curse.maven:modonomicon-538392:8464521" //occultism dependency
	implementation "curse.maven:occultism-361026:8464578"
	implementation "curse.maven:pipe-graph-1494073:8200833" //xycraft world dependency
	implementation "curse.maven:reliquary-reincarnations-241319:8398737"
	implementation "curse.maven:sbm-bone-torch-238695:7878430"
	implementation "curse.maven:silent-gear-297039:8089163"
	implementation "curse.maven:silent-lib-242998:7936002" //silent gear dependency
	implementation "curse.maven:the-undergarden-379849:8432972"
	implementation "curse.maven:tofucraftreload-317469:8460775"
	implementation "curse.maven:volumetrics-1240222:8200785" //xycraft world dependency
	implementation "curse.maven:xycraft-653786:8201469" //xycraft world dependency
	implementation "curse.maven:xycraft-world-653789:8201472"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "Ceiling Torch",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "Ceiling Torch",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 25
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}