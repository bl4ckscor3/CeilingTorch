plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '1.34'
group = 'bl4ckscor3.mod.ceilingtorch'

base {
	archivesName = 'ceilingtorch-26.3'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

neoForge {
    version = "26.3.0.7-beta"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("run/" + name)
			ideName = "CeilingTorch " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}

		data {
			clientData()
			programArguments.addAll('--mod', "ceilingtorch", '--all', '--output', file('src/generated/resources/').getAbsolutePath())
		}
	}

	mods {
		ceilingtorch {
			sourceSet(sourceSets.main)
		}
	}
}

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
	implementation 'curse.maven:jei-238222:8918192'

	implementation "curse.maven:additional-lights-384991:8920210"
	implementation "curse.maven:bagus-lib-866533:8893104" //tofucraftreload dependency
	implementation "curse.maven:sbm-bone-torch-238695:8925431"
	implementation "curse.maven:tofucraftreload-317469:8908376"
}

tasks.named('jar', Jar).configure {
	exclude("net/geforcemods/ceilingtorch/datagen/**") //exclude files from the built jar that are only used to generate the assets & data
    manifest {
        attributes(["Specification-Title": "Ceiling Torch",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "Ceiling Torch",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 25
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}