plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'net.neoforged.gradle.userdev' version '7.0.105'
}

version = '1.31'
group = 'bl4ckscor3.mod.ceilingtorch'

base {
	archivesName = 'ceilingtorch-1.20.6'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
	configureEach {
		systemProperty 'forge.logging.console.level', 'debug'
		modSource project.sourceSets.main
	}

	client {
		workingDirectory project.file('run/client')
	}

	server {
		workingDirectory project.file('run/server')
		programArgument '-nogui'
	}
}

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
	implementation 'net.neoforged:neoforge:20.6.119'
	implementation 'curse.maven:jei-238222:5846787'

	implementation "curse.maven:bagus-lib-866533:5395037" //tofucraftreload dependency
	implementation "curse.maven:curios-309927:5443145" //occultism dependency
	implementation "curse.maven:geckolib-388172:5419281" //occultism dependency
	implementation "curse.maven:modonomicon-538392:5415005" //occultism dependency
	implementation "curse.maven:occultism-361026:5418421"
	implementation "curse.maven:sbm-bone-torch-238695:5851039"
	implementation "curse.maven:silent-lib-242998:5456830" //torch bandolier dependency
	implementation "curse.maven:smartbrainlib-661293:5303000" //occultism dependency
	implementation "curse.maven:the-undergarden-379849:5663496"
	implementation "curse.maven:torch-bandolier-299337:5641069"
	implementation "curse.maven:tofucraftreload-317469:5417612"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "Ceiling Torch",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "Ceiling Torch",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 21
}