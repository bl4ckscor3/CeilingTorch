plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'net.neoforged.gradle.userdev' version '7.0.+'
}

version = '1.31'
group = 'bl4ckscor3.mod.ceilingtorch'

base {
	archivesName = 'ceilingtorch-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
	configureEach {
		systemProperty 'forge.logging.console.level', 'debug'
		modSource project.sourceSets.main
	}

	client {
		workingDirectory project.file('run/client')
	}

	server {
		workingDirectory project.file('run/server')
		argument '-nogui'
	}
}

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
	implementation 'net.neoforged:neoforge:21.1.143'
	implementation 'curse.maven:jei-238222:5846880'
	
	implementation "curse.maven:additional-lights-384991:5504182"
	implementation "curse.maven:adorn-for-forge-438784:5773274"
	implementation "curse.maven:architectury-api-419699:5786327" //bamboo everything dependency
	implementation "curse.maven:athena-841890:5629395" //bamboo everything dependency
	implementation "curse.maven:bagus-lib-866533:5810894" //tofucraftreload dependency
	implementation "curse.maven:bamboo-everything-331723:6320314"
	implementation "curse.maven:chipped-456956:5813117"
	implementation "curse.maven:common-capabilities-247007:6371127" //integrated dynamics dependency
	implementation "curse.maven:curios-309927:6342656" //occultism dependency
	implementation "curse.maven:cyclops-core-232758:6340387" //integrated dynamics dependency
	implementation "curse.maven:gaia-dimension-302529:5773438"
	implementation "curse.maven:geckolib-388172:6304958" //occultism dependency
	implementation "curse.maven:integrated-dynamics-236307:6331508"
	implementation "curse.maven:modonomicon-538392:6338537" //occultism dependency
	implementation "curse.maven:occultism-361026:6355135"
	implementation "curse.maven:projecte-226410:6323142"
	implementation "curse.maven:resourceful-lib-570073:5973188" //bamboo everything dependency
	implementation "curse.maven:sbm-bone-torch-238695:5851041"
	implementation "curse.maven:silent-gear-297039:6365502"
	implementation "curse.maven:silent-lib-242998:6285150" //silent gear and torch bandolier dependency
	implementation "curse.maven:smartbrainlib-661293:6101242" //occultism dependency
	implementation "curse.maven:the-undergarden-379849:5769852"
	implementation "curse.maven:tofucraftreload-317469:6377123"
	implementation "curse.maven:torch-bandolier-299337:5641604"
	implementation "curse.maven:xycraft-653786:5601037" // xycraft world dependency
	implementation "curse.maven:xycraft-world-653789:5601038"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "Ceiling Torch",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "Ceiling Torch",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 21
}