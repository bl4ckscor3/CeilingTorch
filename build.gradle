plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.34'
group = 'bl4ckscor3.mod.ceilingtorch'

base {
	archivesName = 'ceilingtorch-26.2'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
    version = "26.2.0.25-beta"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("run/" + name)
			ideName = "CeilingTorch " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}
	}

	mods {
		ceilingtorch {
			sourceSet(sourceSets.main)
		}
	}
}

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
	implementation 'curse.maven:jei-238222:8472474'

	implementation "curse.maven:additional-lights-384991:8298008"
	implementation "curse.maven:bagus-lib-866533:8309370" //tofucraftreload dependency
	implementation "curse.maven:common-capabilities-247007:8469570" //integrated dynamics dependency
	implementation "curse.maven:cyclops-core-232758:8469541" //integrated dynamics dependency
	implementation "curse.maven:integrated-dynamics-236307:8469208"
	implementation "curse.maven:reliquary-reincarnations-241319:8398733"
	implementation "curse.maven:sbm-bone-torch-238695:8280071"
	implementation "curse.maven:tofucraftreload-317469:8460776"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "Ceiling Torch",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "Ceiling Torch",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 25
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}